<!doctype html>
<!-- Página usada só para exportar a logo em PNG com o Chrome headless.

<html>
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=block" rel="stylesheet"/>
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  body.branco { background: #FFFFFF; }

</style>
</head>
<body>
<script>
  if (new URLSearchParams(location.search).get('fundo') === 'branco') document.body.classList.add('branco');

</html>
